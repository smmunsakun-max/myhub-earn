<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyHub Earn</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
.container{
    max-width:480px;
    margin:auto;
    padding:20px;
}
.header{
    background:#111827;
    color:white;
    padding:22px;
    border-radius:18px;
    margin-bottom:15px;
}
.header h1{
    margin:0 0 8px;
}
.balance{
    font-size:30px;
    font-weight:bold;
}
.card{
    background:white;
    padding:18px;
    border-radius:16px;
    margin:12px 0;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:16px;
    margin-top:12px;
}
.small{
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>💰 MyHub Earn</h1>
<div class="small" style="color:#ccc;">আপনার বর্তমান ব্যালেন্স</div>
<div class="balance">৳0.00</div>
</div>

<div class="card">
<div class="row">
<div>
<b>📺 Advertisement</b>
<div class="small">আজ 0 / 10 টি</div>
</div>
<div>৳0</div>
</div>
<button>বিজ্ঞাপন দেখুন</button>
</div>

<div class="card">
<div class="row">
<div>
<b>👥 Referral</b>
<div class="small">Valid referral: 0 জন</div>
</div>
<div>৳0</div>
</div>
<button>Refer & Earn</button>
</div>

<div class="card">
<div class="row">
<div>
<b>🎁 Daily Bonus</b>
<div class="small">আজকের bonus সংগ্রহ করুন</div>
</div>
</div>
<button>Claim Bonus</button>
</div>

<div class="card">
<b>💰 Withdraw</b>
<div class="small">Minimum withdrawal: ৳1,000</div>
<button>Withdraw</button>
</div>

</div>

</body>
</html>
